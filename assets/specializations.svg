<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" width="100%" height="auto" fill="none">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- ==================== CARD 1: NATIVE ANDROID ==================== -->
  <g transform="translate(15, 10)">
    <!-- Background Card: Solid dark with zinc border -->
    <rect x="0" y="0" width="275" height="175" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />
    
    <!-- Header Pill & Badge -->
    <rect x="18" y="18" width="34" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <!-- Android Vector Icon (Monochrome White) -->
    <g transform="translate(26, 26)">
      <path d="M 3 6 C 3 3 6 0.5 9 0.5 C 12 0.5 15 3 15 6 Z" fill="#ffffff" />
      <circle cx="6.5" cy="3.5" r="0.8" fill="#18181b" />
      <circle cx="11.5" cy="3.5" r="0.8" fill="#18181b" />
      <line x1="5" y1="0.5" x2="3.5" y2="-2" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" />
      <line x1="13" y1="0.5" x2="14.5" y2="-2" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" />
      <rect x="3" y="7.5" width="12" height="7.5" rx="1.5" fill="#d4d4d8" />
    </g>

    <!-- Experience Badge (Monochrome) -->
    <rect x="185" y="20" width="72" height="22" rx="11" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="221" y="35" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle" class="font-sans">3 YEARS</text>

    <!-- Title -->
    <text x="18" y="74" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Native Android</text>
    <text x="18" y="93" fill="#a1a1aa" font-size="12" font-weight="500" class="font-sans">Kotlin • Jetpack Compose • Room</text>

    <!-- Divider Line inside card -->
    <line x1="18" y1="106" x2="257" y2="106" stroke="#27272a" stroke-width="0.8" />

    <!-- Details / Bullets -->
    <g transform="translate(18, 126)">
      <circle cx="4" cy="-4" r="2" fill="#ffffff" />
      <text x="12" y="0" fill="#d4d4d8" font-size="11.5" font-weight="400" class="font-sans">Offline-first architecture &amp; DB</text>

      <circle cx="4" cy="16" r="2" fill="#ffffff" />
      <text x="12" y="20" fill="#d4d4d8" font-size="11.5" font-weight="400" class="font-sans">Hilt, WorkManager &amp; DNS control</text>
    </g>
  </g>

  <!-- ==================== CARD 2: EDGE AI & VISION ==================== -->
  <g transform="translate(312, 10)">
    <!-- Background Card -->
    <rect x="0" y="0" width="275" height="175" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />

    <!-- Header Pill & Badge -->
    <rect x="18" y="18" width="34" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <!-- TFLite / Neural Vector Icon (Monochrome) -->
    <g transform="translate(26, 26)">
      <polygon points="4,3 9,0 9,16 6,14.5 6,8.5 4,10" fill="#71717a" />
      <polygon points="9,0 14,3 11.5,4.5 11.5,14 9,16" fill="#ffffff" />
    </g>

    <!-- Research Badge (Monochrome) -->
    <rect x="175" y="20" width="82" height="22" rx="11" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="216" y="35" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle" class="font-sans">RESEARCH</text>

    <!-- Title -->
    <text x="18" y="74" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Edge AI &amp; Vision</text>
    <text x="18" y="93" fill="#a1a1aa" font-size="12" font-weight="500" class="font-sans">TensorFlow Lite • SPAN • OCR</text>

    <!-- Divider Line inside card -->
    <line x1="18" y1="106" x2="257" y2="106" stroke="#27272a" stroke-width="0.8" />

    <!-- Details / Bullets -->
    <g transform="translate(18, 126)">
      <circle cx="4" cy="-4" r="2" fill="#ffffff" />
      <text x="12" y="0" fill="#d4d4d8" font-size="11.5" font-weight="400" class="font-sans">On-device super-resolution pipeline</text>

      <circle cx="4" cy="16" r="2" fill="#ffffff" />
      <text x="12" y="20" fill="#d4d4d8" font-size="11.5" font-weight="400" class="font-sans">Real-time mobile inference &amp; safety</text>
    </g>
  </g>

  <!-- ==================== CARD 3: SYSTEMS & PLATFORMS ==================== -->
  <g transform="translate(610, 10)">
    <!-- Background Card -->
    <rect x="0" y="0" width="275" height="175" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1.2" />

    <!-- Header Pill & Badge -->
    <rect x="18" y="18" width="34" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <!-- Web / Server Stack Vector Icon (Monochrome) -->
    <g transform="translate(26, 26)">
      <rect x="2" y="1" width="14" height="4" rx="1" fill="#71717a" />
      <rect x="2" y="7" width="14" height="4" rx="1" fill="#a1a1aa" />
      <rect x="2" y="13" width="14" height="4" rx="1" fill="#ffffff" />
      <circle cx="13" cy="3" r="0.7" fill="#18181b" />
      <circle cx="13" cy="9" r="0.7" fill="#18181b" />
      <circle cx="13" cy="15" r="0.7" fill="#18181b" />
    </g>

    <!-- Experience Badge (Monochrome) -->
    <rect x="185" y="20" width="72" height="22" rx="11" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <text x="221" y="35" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle" class="font-sans">2 YEARS</text>

    <!-- Title -->
    <text x="18" y="74" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Systems &amp; Platforms</text>
    <text x="18" y="93" fill="#a1a1aa" font-size="12" font-weight="500" class="font-sans">React • TypeScript • Appwrite</text>

    <!-- Divider Line inside card -->
    <line x1="18" y1="106" x2="257" y2="106" stroke="#27272a" stroke-width="0.8" />

    <!-- Details / Bullets -->
    <g transform="translate(18, 126)">
      <circle cx="4" cy="-4" r="2" fill="#ffffff" />
      <text x="12" y="0" fill="#d4d4d8" font-size="11.5" font-weight="400" class="font-sans">School e-libraries &amp; org portals</text>

      <circle cx="4" cy="16" r="2" fill="#ffffff" />
      <text x="12" y="20" fill="#d4d4d8" font-size="11.5" font-weight="400" class="font-sans">Role-based auth &amp; record tracking</text>
    </g>
  </g>
</svg>
