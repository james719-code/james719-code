<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="auto" fill="none">
  <defs>
    <!-- Pattern for subtle tech grid using solid dark colors only -->
    <pattern id="dark-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1c1c1f" stroke-width="0.75" />
      <circle cx="30" cy="30" r="0.8" fill="#27272a" />
    </pattern>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      @keyframes rotate-radar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotate-radar-rev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .anim-radar {
        transform-origin: 785px 130px;
        animation: rotate-radar 35s linear infinite;
      }
      .anim-radar-rev {
        transform-origin: 785px 130px;
        animation: rotate-radar-rev 50s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box: Deep Black with Solid Border -->
  <rect x="1" y="1" width="898" height="258" rx="16" fill="#09090b" stroke="#27272a" stroke-width="1.5" />

  <!-- Subtle Dark Grid Overlay -->
  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#dark-grid)" />

  <!-- TOP STATUS BADGE -->
  <g transform="translate(48, 30)">
    <rect x="0" y="0" width="260" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <!-- White status dot with pulse -->
    <circle cx="14" cy="13" r="4" fill="#ffffff" />
    <circle cx="14" cy="13" r="7" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" fill="#d4d4d8" font-size="11" font-weight="700" letter-spacing="1.2" class="font-sans">ANDROID &amp; EDGE AI DEVELOPER</text>
  </g>

  <!-- MAIN HEADINGS -->
  <g transform="translate(48, 92)">
    <text x="0" y="0" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5" class="font-sans">James Ryan S. Gallego</text>
    <text x="0" y="28" fill="#d4d4d8" font-size="16" font-weight="600" class="font-sans">Native Android • Computer Vision • Offline-First Edge AI</text>
    <text x="0" y="50" fill="#a1a1aa" font-size="13" font-weight="400" class="font-sans">Lightweight on-device neural models &amp; practical high-impact architectures</text>
  </g>

  <!-- TECH CHIPS ROW: Tightened layout (Ends at x=614, providing 93px safety margin before radar) -->
  <g transform="translate(48, 172)">
    <!-- Kotlin Chip (width 78) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="78" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <polygon points="10,7 20,7 10,18" fill="#71717a" />
      <polygon points="10,18 20,7 20,18" fill="#ffffff" />
      <text x="26" y="19" fill="#ffffff" font-size="11.5" font-weight="600" class="font-sans">Kotlin</text>
    </g>

    <!-- Jetpack Compose Chip (width 130) -->
    <g transform="translate(86, 0)">
      <rect x="0" y="0" width="130" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <polygon points="12,9 20,14 12,19" fill="#ffffff" />
      <polygon points="12,9 16,6 20,14" fill="#a1a1aa" />
      <text x="26" y="19" fill="#ffffff" font-size="11.5" font-weight="600" class="font-sans">Jetpack Compose</text>
    </g>

    <!-- TensorFlow Lite Chip (width 122) -->
    <g transform="translate(224, 0)">
      <rect x="0" y="0" width="122" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <polygon points="12,8 17,5 17,20 14,18 14,13 12,14" fill="#71717a" />
      <polygon points="17,5 22,8 19,10 19,18 17,20" fill="#ffffff" />
      <text x="27" y="19" fill="#ffffff" font-size="11.5" font-weight="600" class="font-sans">TensorFlow Lite</text>
    </g>

    <!-- Room DB Chip (width 86) -->
    <g transform="translate(354, 0)">
      <rect x="0" y="0" width="86" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <ellipse cx="16" cy="10" rx="5" ry="2.2" fill="none" stroke="#d4d4d8" stroke-width="1.1" />
      <path d="M11 10 v4.5 c0 1.2 2.2 2.2 5 2.2 s5 -1 5 -2.2 v-4.5" fill="none" stroke="#d4d4d8" stroke-width="1.1" />
      <text x="27" y="19" fill="#ffffff" font-size="11.5" font-weight="600" class="font-sans">Room DB</text>
    </g>

    <!-- Edge AI / CV Chip (width 118) -->
    <g transform="translate(448, 0)">
      <rect x="0" y="0" width="118" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
      <circle cx="15" cy="14" r="3.5" fill="none" stroke="#d4d4d8" stroke-width="1.1" />
      <circle cx="15" cy="14" r="1.2" fill="#ffffff" />
      <path d="M10 14 C12 10.5 18 10.5 20 14 C18 17.5 12 17.5 10 14 Z" fill="none" stroke="#71717a" stroke-width="0.9" />
      <text x="26" y="19" fill="#ffffff" font-size="11.5" font-weight="600" class="font-sans">SPAN • Edge CV</text>
    </g>
  </g>

  <!-- BOTTOM ACCENT STRIP -->
  <g transform="translate(48, 230)">
    <circle cx="4" cy="4" r="3" fill="#ffffff" />
    <text x="14" y="8" fill="#71717a" font-size="11" font-weight="500" class="font-sans">Philippines • Building production-grade Android apps, research models &amp; student systems</text>
  </g>

  <!-- RIGHT SIDE: MONOCHROME CYBER TECH GRAPHIC (Shifted right to cx=785, cy=130; leftmost boundary at x=707) -->
  <g id="edge-ai-radar">
    <!-- Outer dashed rotating radar circle (r=78 -> x bounds 707..863) -->
    <circle cx="785" cy="130" r="78" fill="none" stroke="#27272a" stroke-width="1.2" stroke-dasharray="6 6" class="anim-radar" opacity="0.8" />
    <!-- Secondary counter-rotating dashed ring (r=58 -> x bounds 727..843) -->
    <circle cx="785" cy="130" r="58" fill="none" stroke="#3f3f46" stroke-width="1" stroke-dasharray="10 8" class="anim-radar-rev" opacity="0.6" />
    <!-- Outer faint accent boundary (r=94 -> x bounds 691..879) -->
    <circle cx="785" cy="130" r="94" fill="none" stroke="#27272a" stroke-width="0.8" stroke-dasharray="3 12" opacity="0.4" />

    <!-- Circuit Connecting Traces (Monochrome Zinc) -->
    <line x1="785" y1="92" x2="785" y2="52" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="3 3" />
    <line x1="818" y1="111" x2="854" y2="92" stroke="#3f3f46" stroke-width="1.2" />
    <line x1="818" y1="149" x2="852" y2="168" stroke="#3f3f46" stroke-width="1.2" />
    <line x1="785" y1="168" x2="785" y2="208" stroke="#3f3f46" stroke-width="1.2" stroke-dasharray="3 3" />
    <line x1="752" y1="149" x2="718" y2="174" stroke="#3f3f46" stroke-width="1.2" />
    <line x1="752" y1="111" x2="718" y2="86" stroke="#3f3f46" stroke-width="1.2" />

    <!-- Satellite Nodes -->
    <!-- Top Node -->
    <g transform="translate(785, 52)">
      <circle cx="0" cy="0" r="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>
    <!-- Top-Right Node -->
    <g transform="translate(854, 92)">
      <circle cx="0" cy="0" r="11" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3" fill="#d4d4d8" />
    </g>
    <!-- Bottom-Right Node -->
    <g transform="translate(852, 168)">
      <circle cx="0" cy="0" r="11" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3" fill="#a1a1aa" />
    </g>
    <!-- Bottom Node -->
    <g transform="translate(785, 208)">
      <circle cx="0" cy="0" r="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>
    <!-- Left-Bottom Node (Center at x=718, r=11 -> leftmost edge x=707) -->
    <g transform="translate(718, 174)">
      <circle cx="0" cy="0" r="11" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3" fill="#71717a" />
    </g>
    <!-- Left-Top Node (Center at x=718, r=11 -> leftmost edge x=707) -->
    <g transform="translate(718, 86)">
      <circle cx="0" cy="0" r="11" fill="#18181b" stroke="#3f3f46" stroke-width="1.2" />
      <circle cx="0" cy="0" r="3" fill="#a1a1aa" />
    </g>

    <!-- Central Hexagonal Core (Center 785, 130) -->
    <g transform="translate(785, 130)">
      <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="#121214" stroke="#ffffff" stroke-width="1.5" />
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
      
      <!-- Android Bugdroid Head Vector in Pure Crisp White -->
      <g transform="translate(0, -2)">
        <path d="M -11 -2 C -11 -8.5 -6 -13.5 0 -13.5 C 6 -13.5 11 -8.5 11 -2 Z" fill="#ffffff" />
        <circle cx="-4.5" cy="-7" r="1.2" fill="#121214" />
        <circle cx="4.5" cy="-7" r="1.2" fill="#121214" />
        <line x1="-6.5" y1="-12" x2="-9.5" y2="-16" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
        <line x1="6.5" y1="-12" x2="9.5" y2="-16" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
        <rect x="-11" y="0" width="22" height="13" rx="2" fill="#d4d4d8" />
        <path d="M -7 4 L 7 4" stroke="#121214" stroke-width="1.2" stroke-linecap="round" />
        <path d="M -4 8 L 4 8" stroke="#121214" stroke-width="1.2" stroke-linecap="round" />
      </g>
    </g>

    <!-- Animated Data Pulses in White -->
    <circle r="2.5" fill="#ffffff">
      <animateMotion path="M 785,92 L 785,52" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5" fill="#ffffff">
      <animateMotion path="M 785,168 L 785,208" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle r="2" fill="#d4d4d8">
      <animateMotion path="M 818,111 L 854,92" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
