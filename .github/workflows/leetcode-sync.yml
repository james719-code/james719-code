name: Profile Stats Sync

on:
  schedule:
    # Runs automatically every 24 hours (daily at 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_leetcode.py'
      - 'scripts/update_github_stats.py'
      - '.github/workflows/leetcode-sync.yml'

# Ensure the workflow has permission to commit and push changes back to the repo
permissions:
  contents: write

jobs:
  sync-stats:
    name: Sync Developer Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run LeetCode Sync Script
        env:
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME || 'james719-code' }}
        run: |
          python scripts/update_leetcode.py

      - name: Run GitHub Analytics Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || 'james719-code' }}
        run: |
          python scripts/update_github_stats.py

      - name: Commit and Push Updated Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/leetcode-stats.svg assets/leetcode-cache.json assets/github-stats.svg assets/github-cache.json README.md
          if git diff --staged --quiet; then
            echo "No changes detected in profile assets or README. Skipping commit."
          else
            git commit -m "chore(stats): update profile statistics [skip ci]"
            git push
          fi
